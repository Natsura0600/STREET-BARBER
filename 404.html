<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada | Street Barber</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    .notfound { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px 20px; background: var(--ink); color: #fff; }
    .notfound img { width: 64px; height: 64px; margin: 0 auto 28px; border-radius: 14px; }
    .notfound h1 { font-size: clamp(30px, 5vw, 44px); font-weight: 800; letter-spacing: -.02em; }
    .notfound p { color: #b9c0cb; margin: 12px auto 30px; max-width: 42ch; }
    .notfound .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  </style>
</head>
<body>
  <main class="notfound">
    <div>
      <img src="/assets/img/favicon.svg" alt="Street Barber">
      <h1>No encontramos esta página</h1>
      <p>Puede que el enlace esté mal escrito o que la página ya no exista.</p>
      <div class="actions">
        <a class="btn btn--primary btn--lg" href="/">Volver al inicio</a>
        <a class="btn btn--ghost btn--lg" href="https://streetbarber.site.agendapro.com/ar" target="_blank" rel="noopener">Reservar turno</a>
      </div>
    </div>
  </main>
</body>
</html>
